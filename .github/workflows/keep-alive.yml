name: Keep Supabase Alive

on:
  schedule:
    # Run every day at 6 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NovaMint Supabase
        run: |
          echo "🏓 Pinging NovaMint Supabase..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://elmemolbipdsjppqcaux.supabase.co/rest/v1/orders?select=count&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsbWVtb2xiaXBkc2pwcHFjYXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzY0MTIsImV4cCI6MjA4OTQxMjQxMn0.zi73dc-NUSfMjj609oV_eVTYUYwlOjD6SeXLu2QzUew" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsbWVtb2xiaXBkc2pwcHFjYXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzY0MTIsImV4cCI6MjA4OTQxMjQxMn0.zi73dc-NUSfMjj609oV_eVTYUYwlOjD6SeXLu2QzUew")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ NovaMint Supabase is alive!"
          else
            echo "❌ NovaMint ping failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Summary
        run: |
          echo "================================================"
          echo "🎉 Keep-alive ping completed at $(date -u)"
          echo "================================================"
